<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>家庭與課堂中心驗收頁</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        background: #10162b;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      .question {
        max-width: 640px;
        padding: 24px;
        border-radius: 16px;
        background: #1b2443;
      }
      .option { display: block; margin-top: 10px; padding: 10px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>驗收用學習平台</h1>
        <div class="question">下列哪一句最能表現主動積極？</div>
        <button class="option">A 等別人提醒再開始</button>
        <button class="option">B 先決定自己能做的第一步</button>
        <button class="option">C 把責任全部交給環境</button>
        <button class="option">D 遇到困難立刻放棄</button>
        <p class="explanation">主動積極是把注意力放在自己的影響圈。</p>
      </section>
    </main>
    <script
      type="module"
      src="../../family-classroom.js?site=wenhao-xiaozhuan&fixture=1"
    ></script>
  </body>
</html>
